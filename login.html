<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BBA Group secure login">
  <title>BBA Group — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-brand">
      <div class="brand-mark big">B</div>
      <span class="eyebrow">BBA GROUP</span>
      <h1>Your smarter student workspace.</h1>
      <p>Connect with your group, access shared notes and stay on top of your studies.</p>
      <div class="auth-features">
        <span><i class="fa-solid fa-users"></i> Group collaboration</span>
        <span><i class="fa-solid fa-folder-open"></i> Shared resources</span>
        <span><i class="fa-solid fa-moon"></i> Dark mode</span>
      </div>
    </section>

    <section class="login-card">
      <div class="login-heading">
        <span class="eyebrow">WELCOME BACK</span>
        <h2>Sign in to continue</h2>
        <p>Use your group account details below.</p>
      </div>
      <form id="loginForm">
        <label for="name">Full name</label>
        <div class="input-wrap"><i class="fa-regular fa-user"></i><input type="text" id="name" placeholder="e.g. Rahul Kumar" autocomplete="name" required></div>

        <label for="phone">Phone number</label>
        <div class="input-wrap"><i class="fa-solid fa-phone"></i><input type="tel" id="phone" placeholder="10-digit phone number" inputmode="numeric" autocomplete="tel" required></div>

        <label for="password">Password</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required><button type="button" class="password-toggle" id="passwordToggle"><i class="fa-regular fa-eye"></i></button></div>

        <p id="loginError" class="form-error" role="alert"></p>
        <button type="submit" class="primary-btn full">Sign in <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p class="auth-note"><i class="fa-solid fa-shield-halved"></i> Your session is stored locally on this device.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

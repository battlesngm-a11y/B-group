<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBA Group — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">B</div><div><span class="eyebrow">BBA GROUP</span><h1>Admin Console</h1></div></div>
      <button class="icon-btn" id="adminThemeToggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </header>
    <main class="admin-main">
      <div class="page-title"><div><span class="eyebrow">MANAGEMENT</span><h2>Group Overview</h2><p>Monitor members and shared resources.</p></div></div>
      <div class="stats-grid admin-stats">
        <div class="stat-card"><span class="stat-icon members-icon"><i class="fa-solid fa-users"></i></span><span><strong id="adminMemberCount">0</strong><small>Members</small></span></div>
        <div class="stat-card"><span class="stat-icon notes-icon"><i class="fa-solid fa-file-lines"></i></span><span><strong id="adminFileCount">0</strong><small>Shared notes</small></span></div>
      </div>
      <div class="admin-panel">
        <div class="section-heading"><div><span class="eyebrow">DIRECTORY</span><h3>Members</h3></div></div>
        <div id="adminList" class="admin-list"></div>
      </div>
      <div class="admin-panel">
        <div class="section-heading"><div><span class="eyebrow">RESOURCES</span><h3>Shared notes</h3></div></div>
        <div id="adminFiles" class="card-list"></div>
      </div>
      <div class="admin-panel">
        <div class="section-heading"><div><span class="eyebrow">COMMUNICATION</span><h3>Chat activity</h3></div></div>
        <div id="adminChat" class="admin-list"></div>
      </div>
      <button class="secondary-btn" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Back to dashboard</button>
    </main>
  </div>
<script type="module" src="script.js"></script>
</body>
</html>
